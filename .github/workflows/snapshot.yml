name: Data snapshot

# A copy of the data kept outside the git history: a GitHub Release tagged data-YYYY-MM-DD, and a request to
# the Internet Archive to save each source page (scraper/snapshot.py). Twice a year, after the spring seasons
# (July 1) and after the fall seasons (January 2), at off-peak minutes, and on demand. It does nothing, and
# succeeds, when the data has not changed since the newest data-* release.

on:
  schedule:
    - cron: "23 14 1 7 *"
    - cron: "41 15 2 1 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-snapshot
  cancel-in-progress: false

jobs:
  prepare:
    # Read-only: decides whether anything changed, then builds the release files, asks the Internet Archive to
    # save the source pages (best effort, so a slow or refusing archive never fails the run) and hands the
    # files to the release job as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Has the data changed since the last snapshot?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scraper/snapshot.py check

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ steps.check.outputs.changed == 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the release files
        if: ${{ steps.check.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pip install -r requirements.txt
          python scraper/snapshot.py build --out release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.check.outputs.changed == 'true' }}
        with:
          name: snapshot
          path: release
          retention-days: 3
          if-no-files-found: error

  release:
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          tag="$(cat release/TAG)"
          gh release create "$tag" \
            release/series.json release/depauw.json release/wabash.json release/overrides.json \
            release/upcoming.json release/games.csv \
            --title "Data snapshot ${tag#data-}" --notes-file release/NOTES.md --target "$TARGET"
